# ===== P0 SEO：旧码点页 -> 语义 slug 页 301 重定向 =====
# 映射文件由 seo-research/p0-canonical-fix.py 自动生成，勿手改。
# 同时覆盖两种 URI 形态：容器内相对（/emoji/...）与站点子目录（/emoji-hub/emoji/...）。
map $uri $emoji_redirect {
    include /etc/nginx/conf.d/emoji-redirects.map;
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML/JS/CSS 始终向源站校验，避免浏览器缓存旧版导致样式错乱
    location / {
        # 旧码点页（如 /emoji/1f600.html）301 到语义详情页，完整传递权重
        if ($emoji_redirect != "") {
            return 301 $emoji_redirect;
        }
        add_header Cache-Control "no-cache";
    }
    # P2 性能：静态资源长缓存。注意 CSS/JS 文件名无 hash，
    # 更新后用户最多 30 天才能拿到新版；未来建议引入内容 hash 文件名后可延长到 1 年。
    location /assets/css/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /assets/js/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    # 字体几乎不变，缓存 1 年
    location /assets/fonts/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/data/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
